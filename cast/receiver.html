<!doctype html>
<!--
  Interactive Fitness Chromecast receiver (Google Cast Custom Receiver 97FB2AE8).
  The game runs on the phone and is streamed to this page over WebRTC on the home network:
  the picture and the game's sound (the phone is silent while casting).
  The WebRTC handshake goes over the Cast message channel below (no other server), and this page
  stays loaded for the whole session so the Cast framework keeps the app alive.

  Picture and sound come as two separate WebRTC streams ("game", "game-audio").
  Phone -> TV: {"type":"offer","sdp":"..."}   (complete SDP, no trickle ICE)
  TV -> phone: {"type":"answer","sdp":"..."}
  Must match ios/websocket/Cast/CastController.swift and GameStreamer.swift.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Interactive Fitness</title>
<script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden;
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  video { position: fixed; inset: 0; width: 100vw; height: 100vh; object-fit: contain; background: #000; }
  #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; background: #0e0f11; color: #eceef2; text-align: center; }
  .brand { font-weight: 800; letter-spacing: .14em; font-size: 28px; color: #ff6b2c; }
  #status { margin-top: 18px; font-size: 22px; color: #a2a7b3; }
</style>
</head>
<body>
<video id="video" autoplay muted playsinline></video>
<audio id="audio" autoplay></audio>
<div id="splash">
  <div class="brand" id="brand">INTERACTIVE FITNESS</div>
  <div id="status"></div>
</div>
<script>
  const NAMESPACE = "urn:x-cast:com.hasbis.interactive.fitness";
  const tr = (navigator.language || "").toLowerCase().startsWith("tr");
  const TEXT = tr
    ? { brand: "İNTERAKTİF FİTNESS", connecting: "Telefona bağlanıyor…", lost: "Bağlantı koptu…" }
    : { brand: "INTERACTIVE FITNESS", connecting: "Connecting to your phone…", lost: "Connection lost…" };

  const video = document.getElementById("video");
  const audio = document.getElementById("audio");
  const splash = document.getElementById("splash");
  const status = document.getElementById("status");
  document.getElementById("brand").textContent = TEXT.brand;
  status.textContent = TEXT.connecting;
  let peer = null;

  function showSplash(text) { status.textContent = text; splash.style.display = "flex"; }
  function hideSplash() { splash.style.display = "none"; }

  function gathered(pc) {
    return new Promise(resolve => {
      if (pc.iceGatheringState === "complete") return resolve();
      const timer = setTimeout(resolve, 1500);
      pc.addEventListener("icegatheringstatechange", () => {
        if (pc.iceGatheringState === "complete") { clearTimeout(timer); resolve(); }
      });
    });
  }

  async function answerOffer(sdp, senderId) {
    if (peer) peer.close();
    const pc = new RTCPeerConnection({ iceServers: [] });
    peer = pc;
    pc.ontrack = e => {
      const stream = e.streams[0] || new MediaStream([e.track]);
      if (e.track.kind === "audio") {
        // The game's sound: its own stream (not synced to the picture, which would hold the
        // picture back) with a small buffer (the phone already smooths it out).
        try { e.receiver.jitterBufferTarget = 20; } catch (_) {}
        audio.srcObject = stream;
        audio.play().catch(() => {});
        return;
      }
      // Show frames as soon as they arrive: latency matters more than smoothness for a motion game.
      try { e.receiver.playoutDelayHint = 0; } catch (_) {}
      try { e.receiver.jitterBufferTarget = 0; } catch (_) {}
      video.srcObject = stream;
      video.play().catch(() => {});
      hideSplash();
    };
    pc.onconnectionstatechange = () => {
      if (pc === peer && (pc.connectionState === "failed" || pc.connectionState === "disconnected")) {
        showSplash(TEXT.lost);
      }
    };
    await pc.setRemoteDescription({ type: "offer", sdp });
    await pc.setLocalDescription(await pc.createAnswer());
    await gathered(pc);
    context.sendCustomMessage(NAMESPACE, senderId, { type: "answer", sdp: pc.localDescription.sdp });
  }

  const context = cast.framework.CastReceiverContext.getInstance();
  context.addCustomMessageListener(NAMESPACE, event => {
    const data = typeof event.data === "string" ? JSON.parse(event.data) : event.data;
    if (data && data.type === "offer" && typeof data.sdp === "string") {
      answerOffer(data.sdp, event.senderId).catch(err => console.error("answer failed", err));
    }
  });
  const options = new cast.framework.CastReceiverOptions();
  options.customNamespaces = { [NAMESPACE]: cast.framework.system.MessageType.JSON };
  options.disableIdleTimeout = true;
  options.skipPlayersLoad = true; // no media player: the page shows a WebRTC stream itself
  context.start(options);
</script>
</body>
</html>
