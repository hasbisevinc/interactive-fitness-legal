<!doctype html>
<!--
  Interactive Fitness Chromecast receiver (Google Cast Custom Receiver 97FB2AE8).
  The game runs on the phone and is streamed to this page over WebRTC on the home network:
  the picture and the game's sound (the phone is silent while casting).
  The WebRTC handshake goes over the Cast message channel below (no other server), and this page
  stays loaded for the whole session so the Cast framework keeps the app alive.

  Picture and sound come as two separate WebRTC streams ("game", "game-audio").
  Phone -> TV: {"type":"offer","sdp":"..."}   (complete SDP, no trickle ICE)
  TV -> phone: {"type":"answer","sdp":"..."}
  TV -> phone: {"type":"stats", ...} every 2 s while the picture plays: how long the stream takes on
               this side (network, jitter buffer, decode, frame receive -> screen), see sendStats.
  Must match ios/websocket/Cast/CastController.swift and GameStreamer.swift.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Interactive Fitness</title>
<script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden;
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  video { position: fixed; inset: 0; width: 100vw; height: 100vh; object-fit: contain; background: #000; }
  #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; background: #0e0f11; color: #eceef2; text-align: center; }
  .brand { font-weight: 800; letter-spacing: .14em; font-size: 28px; color: #ff6b2c; }
  #status { margin-top: 18px; font-size: 22px; color: #a2a7b3; }
</style>
</head>
<body>
<video id="video" autoplay muted playsinline></video>
<audio id="audio" autoplay></audio>
<div id="splash">
  <div class="brand" id="brand">INTERACTIVE FITNESS</div>
  <div id="status"></div>
</div>
<script>
  const NAMESPACE = "urn:x-cast:com.hasbis.interactive.fitness";
  const tr = (navigator.language || "").toLowerCase().startsWith("tr");
  const TEXT = tr
    ? { brand: "İNTERAKTİF FİTNESS", connecting: "Telefona bağlanıyor…", lost: "Bağlantı koptu…" }
    : { brand: "INTERACTIVE FITNESS", connecting: "Connecting to your phone…", lost: "Connection lost…" };

  const video = document.getElementById("video");
  const audio = document.getElementById("audio");
  const splash = document.getElementById("splash");
  const status = document.getElementById("status");
  document.getElementById("brand").textContent = TEXT.brand;
  status.textContent = TEXT.connecting;
  let peer = null;
  let sender = null;       // the phone's Cast sender id (stats go back to it)
  let lastStats = null;    // the previous getStats totals: the stats sent are for the last 2 s
  let frameTimes = [];     // receive -> expected display (ms) per frame, from requestVideoFrameCallback
  let frameProcessing = []; // decode etc. per frame (ms), when the browser reports it

  function showSplash(text) { status.textContent = text; splash.style.display = "flex"; }
  function hideSplash() { splash.style.display = "none"; }

  function gathered(pc) {
    return new Promise(resolve => {
      if (pc.iceGatheringState === "complete") return resolve();
      const timer = setTimeout(resolve, 1500);
      pc.addEventListener("icegatheringstatechange", () => {
        if (pc.iceGatheringState === "complete") { clearTimeout(timer); resolve(); }
      });
    });
  }

  async function answerOffer(sdp, senderId) {
    if (peer) peer.close();
    const pc = new RTCPeerConnection({ iceServers: [] });
    peer = pc;
    pc.ontrack = e => {
      const stream = e.streams[0] || new MediaStream([e.track]);
      if (e.track.kind === "audio") {
        // The game's sound: its own stream (not synced to the picture, which would hold the
        // picture back) with a small buffer (the phone already smooths it out).
        try { e.receiver.jitterBufferTarget = 20; } catch (_) {}
        audio.srcObject = stream;
        audio.play().catch(() => {});
        return;
      }
      // Show frames as soon as they arrive: latency matters more than smoothness for a motion game.
      try { e.receiver.playoutDelayHint = 0; } catch (_) {}
      try { e.receiver.jitterBufferTarget = 0; } catch (_) {}
      video.srcObject = stream;
      video.play().catch(() => {});
      hideSplash();
      watchFrames();
    };
    pc.onconnectionstatechange = () => {
      if (pc === peer && (pc.connectionState === "failed" || pc.connectionState === "disconnected")) {
        showSplash(TEXT.lost);
      }
    };
    await pc.setRemoteDescription({ type: "offer", sdp });
    await pc.setLocalDescription(await pc.createAnswer());
    await gathered(pc);
    sender = senderId;
    lastStats = null;
    context.sendCustomMessage(NAMESPACE, senderId, { type: "answer", sdp: pc.localDescription.sdp });
  }

  // ── Stream delay on the TV side ──
  // Per frame: from its last packet arriving to when it is expected on screen (jitter buffer,
  // decode, compositing). Not every receiver has requestVideoFrameCallback; then getStats alone.
  let watchingFrames = false;
  function watchFrames() {
    if (watchingFrames || !("requestVideoFrameCallback" in HTMLVideoElement.prototype)) return;
    watchingFrames = true;
    const onFrame = (now, meta) => {
      if (meta.receiveTime > 0 && meta.expectedDisplayTime > 0) {
        const ms = meta.expectedDisplayTime - meta.receiveTime;
        if (ms >= 0 && ms < 5000) frameTimes.push(ms);
      }
      if (meta.processingDuration > 0) frameProcessing.push(meta.processingDuration * 1000);
      if (frameTimes.length > 600) frameTimes.splice(0, frameTimes.length - 600);
      if (frameProcessing.length > 600) frameProcessing.splice(0, frameProcessing.length - 600);
      video.requestVideoFrameCallback(onFrame);
    };
    video.requestVideoFrameCallback(onFrame);
  }

  const average = list => list.length ? list.reduce((a, b) => a + b, 0) / list.length : null;
  const round = value => value == null || !isFinite(value) ? null : Math.round(value * 10) / 10;

  // Every 2 s: what the last 2 s cost on this side, in ms (null = not reported by this receiver).
  //   rttMs       network round trip (one way is about half)
  //   jitterMs    average time a frame waited in the jitter buffer
  //   decodeMs    average decode time per frame
  //   processingMs first packet in -> decoded, per frame (jitter buffer + decode)
  //   displayMs   last packet in -> expected on screen, per frame (requestVideoFrameCallback)
  //   fps, dropped, freezes, width, height
  async function sendStats() {
    const pc = peer;
    if (!pc || !sender || pc.connectionState !== "connected") return;
    let report;
    try { report = await pc.getStats(); } catch (_) { return; }
    let inbound = null, pair = null;
    report.forEach(stat => {
      if (stat.type === "inbound-rtp" && stat.kind === "video") inbound = stat;
      if (stat.type === "candidate-pair" && stat.nominated && stat.state === "succeeded") pair = stat;
    });
    if (!inbound) return;
    const now = {
      emitted: inbound.jitterBufferEmittedCount || 0, jitter: inbound.jitterBufferDelay || 0,
      decoded: inbound.framesDecoded || 0, decode: inbound.totalDecodeTime || 0,
      processing: inbound.totalProcessingDelay || 0,
      dropped: inbound.framesDropped || 0, freezes: inbound.freezeCount || 0,
    };
    const before = lastStats;
    lastStats = now;
    if (!before) return; // the first reading only sets the starting totals
    const emitted = now.emitted - before.emitted;
    const decoded = now.decoded - before.decoded;
    const message = {
      type: "stats",
      rttMs: pair && pair.currentRoundTripTime != null ? round(pair.currentRoundTripTime * 1000) : null,
      jitterMs: emitted > 0 ? round((now.jitter - before.jitter) / emitted * 1000) : null,
      decodeMs: decoded > 0 ? round((now.decode - before.decode) / decoded * 1000) : null,
      processingMs: decoded > 0 && now.processing > 0 ? round((now.processing - before.processing) / decoded * 1000) : null,
      displayMs: round(average(frameTimes)),
      frameProcessingMs: round(average(frameProcessing)),
      fps: inbound.framesPerSecond != null ? round(inbound.framesPerSecond) : null,
      dropped: now.dropped - before.dropped,
      freezes: now.freezes - before.freezes,
      width: inbound.frameWidth || null,
      height: inbound.frameHeight || null,
    };
    frameTimes = [];
    frameProcessing = [];
    try { context.sendCustomMessage(NAMESPACE, sender, message); } catch (_) {}
  }
  setInterval(() => { sendStats().catch(() => {}); }, 2000);

  const context = cast.framework.CastReceiverContext.getInstance();
  context.addCustomMessageListener(NAMESPACE, event => {
    const data = typeof event.data === "string" ? JSON.parse(event.data) : event.data;
    if (data && data.type === "offer" && typeof data.sdp === "string") {
      answerOffer(data.sdp, event.senderId).catch(err => console.error("answer failed", err));
    }
  });
  const options = new cast.framework.CastReceiverOptions();
  options.customNamespaces = { [NAMESPACE]: cast.framework.system.MessageType.JSON };
  options.disableIdleTimeout = true;
  options.skipPlayersLoad = true; // no media player: the page shows a WebRTC stream itself
  context.start(options);
</script>
</body>
</html>
